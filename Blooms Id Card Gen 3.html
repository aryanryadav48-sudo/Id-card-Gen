<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Blooms ID Card Generator</title>

    <style>
        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
        }

        .container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background: white;
            padding: 16px;
            border-radius: 0;
            box-sizing: border-box;
        }

        input {
            width: 100%;
            padding: 11px;
            margin: 5px 0 15px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            margin: 5px 2px;
            font-size: 14px;
        }

        #generate {
            background: #6b3d8f;
            color: white;
        }

        #download {
            background: #333;
            color: white;
        }

        canvas {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 18px auto 0;
            border: 1px solid #ddd;
        }

        @media (max-width: 430px) {
            .container {
                max-width: none;
                width: 100%;
                padding: 14px;
            }
        }

        h2 {
            font-size: 22px;
            margin-top: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>The Blooms ID Card Generator</h2>

    <label>Card / ID Number</label>
    <input id="cardNumber" type="text" placeholder="Generated automatically" readonly>

    <label>Student Name</label>
    <input id="studentName" type="text" placeholder="Enter Name">

    <label>Bungalow Number</label>
    <input id="bungalow" type="text" value="38">

    <label>Manager Number</label>
    <input id="manager" type="text" value="9274751357">

    <label>Student Photo</label>
    <input id="studentPhoto" type="file" accept="image/*">

    <label>QR Code</label>
    <div style="padding:10px 0 15px;color:#666;">
        QR code will be generated automatically from the entered ID details.
    </div>

    <button id="generate">Generate ID Card</button>
    <button id="download">Download PNG</button>

    <canvas id="canvas"></canvas>

</div>

/* ============================================================
   FILE LOADER
   ============================================================ */

function loadFile(input) {

    return new Promise(function(resolve, reject) {

        const file = input.files[0];

        if (!file) {
            resolve(null);
            return;
        }

        const reader = new FileReader();

        reader.onload = function(e) {

            const img = new Image();

            img.onload = function() {
                resolve(img);
            };

            img.onerror = reject;

            img.src = e.target.result;
        };

        reader.onerror = reject;

        reader.readAsDataURL(file);
    });
}


/* ============================================================
   AUTOMATIC QR GENERATOR
   ============================================================

   Uses QR Server's public QR-generation API.
   The QR contains plain student details, so scanning it
   simply displays those details on the phone.
*/

function generateQRImage(data) {

    return new Promise(async function(resolve, reject) {

        try {

            const qrURL =
                "https://quickchart.io/qr" +
                "?text=" + encodeURIComponent(data) +
                "&size=600" +
                "&margin=4" +
                "&ecLevel=H" +
                "&format=png";

            /*
              Fetch the QR image as a blob first.
              This makes it safe to draw into our canvas and export
              the completed ID card as a PNG.
            */
            const response = await fetch(qrURL, {
                mode: "cors"
            });

            if (!response.ok) {
                throw new Error("QR service returned an error.");
            }

            const blob = await response.blob();

            const imageURL = URL.createObjectURL(blob);

            const img = new Image();

            img.onload = function() {
                URL.revokeObjectURL(imageURL);
                resolve(img);
            };

            img.onerror = function() {
                URL.revokeObjectURL(imageURL);
                reject(new Error("QR image could not be loaded."));
            };

            img.src = imageURL;

        } catch (error) {

            reject(
                new Error(
                    "Could not generate QR code. " +
                    "Please make sure the computer is connected to the internet."
                )
            );
        }
    });
}


/* ============================================================
   DRAW IMAGE - COVER
   ============================================================

   This makes the photo completely fill the box.

   It crops excess parts of the photo instead of leaving
   blank spaces.
*/

function drawCover(image, x, y, width, height) {

    const scale = Math.max(
        width / image.width,
        height / image.height
    );

    const newWidth = image.width * scale;
    const newHeight = image.height * scale;

    const offsetX =
        x + (width - newWidth) / 2;

    const offsetY =
        y + (height - newHeight) / 2;


    ctx.save();

    ctx.beginPath();

    ctx.rect(
        x,
        y,
        width,
        height
    );

    ctx.clip();


    ctx.drawImage(
        image,
        offsetX,
        offsetY,
        newWidth,
        newHeight
    );

    ctx.restore();
}


/* ============================================================
   DRAW IMAGE - CONTAIN
   ============================================================

   Useful for QR codes.

   It keeps the complete QR visible.
*/

function drawContain(image, x, y, width, height) {

    const scale = Math.min(
        width / image.width,
        height / image.height
    );

    const newWidth = image.width * scale;
    const newHeight = image.height * scale;

    const offsetX =
        x + (width - newWidth) / 2;

    const offsetY =
        y + (height - newHeight) / 2;


    ctx.drawImage(
        image,
        offsetX,
        offsetY,
        newWidth,
        newHeight
    );
}


/* ============================================================
   WHITE RECTANGLE
   ============================================================ */

function whiteBox(x, y, width, height) {

    ctx.fillStyle = "white";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );
}


/* ============================================================
   TEXT
   ============================================================ */

function drawText(
    text,
    x,
    y,
    fontSize = 38
) {

    ctx.fillStyle = "#111";

    ctx.font =
        fontSize + "px Arial";

    ctx.textAlign = "left";

    ctx.textBaseline = "middle";

    ctx.fillText(
        text,
        x,
        y
    );
}


/* ============================================================
   GENERATE CARD
   ============================================================ */

document.getElementById("generate").onclick =
async function () {

    const name =
        document.getElementById("studentName").value.trim();

    const bungalow =
        document.getElementById("bungalow").value;

    const manager =
        document.getElementById("manager").value;

    if (!name) {
        alert("Please enter Student Name.");
        return;
    }

    /*
       AUTOMATIC ID FORMAT

       38 + first-letter-position (2 digits)
          + random alphabet
          + number of characters in name (2 digits)
          + last-letter-position (2 digits)

       Example:
       Aryan -> 3801X0514
    */

    const lettersOnly = name.match(/[A-Za-z]/g) || [];

    if (lettersOnly.length === 0) {
        alert("Student name must contain at least one alphabet.");
        return;
    }

    const firstLetter = lettersOnly[0].toUpperCase();
    const lastLetter = lettersOnly[lettersOnly.length - 1].toUpperCase();

    const firstPosition =
        String(firstLetter.charCodeAt(0) - 64).padStart(2, "0");

    const lastPosition =
        String(lastLetter.charCodeAt(0) - 64).padStart(2, "0");

    const characterCount =
        String(lettersOnly.length).padStart(2, "0");

    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const usedIds =
        JSON.parse(localStorage.getItem("bloomsUsedCardIds") || "[]");

    let cardNumber;
    let attempts = 0;

    do {
        const randomLetter =
            alphabet[Math.floor(Math.random() * alphabet.length)];

        cardNumber =
            "38" +
            firstPosition +
            randomLetter +
            characterCount +
            lastPosition;

        attempts++;

        if (attempts > 100) {
            alert("Could not generate a unique ID. Please try again.");
            return;
        }

    } while (usedIds.includes(cardNumber));

    usedIds.push(cardNumber);

    localStorage.setItem(
        "bloomsUsedCardIds",
        JSON.stringify(usedIds)
    );

    document.getElementById("cardNumber").value = cardNumber;

    /* Load student photo */


    photoImage =
        await loadFile(
            document.getElementById("studentPhoto")
        );


    /* ========================================================
       AUTOMATIC QR CODE
       ========================================================

       The QR contains the entered ID details.
       Scanning the QR will show these details.
    */

    const qrData =
        "ID Number: " + cardNumber + "\n" +
        "Name: " + name + "\n" +
        "Valid: Yes";

    try {

        qrImage =
            await generateQRImage(qrData);

    } catch (error) {

        alert(
            "QR code could not be generated. " +
            "Please check your internet connection and try again."
        );

        return;
    }


    /* ========================================================
       START WITH ORIGINAL TEMPLATE
       ======================================================== */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.drawImage(
        templateImage,
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* ========================================================
       🔧 EDIT THESE COORDINATES
       ========================================================

       Your template is:

       WIDTH  = 1152
       HEIGHT = 1536

       x = distance from LEFT
       y = distance from TOP

       width  = box width
       height = box height


       Use these values as starting points.

       Change them until everything lines up perfectly.
       ======================================================== */


    /* --------------------------------------------------------
       STUDENT PHOTO
       -------------------------------------------------------- */

    if (photoImage) {

        /*
            PHOTO BOX
        */

        const photoX = 797;
        const photoY = 217;

        const photoWidth = 530;
        const photoHeight = 650;


        /*
            Remove the placeholder
        */

        whiteBox(
            photoX,
            photoY,
            photoWidth,
            photoHeight
        );


        /*
            Put student's photo there
        */

        drawCover(
            photoImage,
            photoX,
            photoY,
            photoWidth,
            photoHeight
        );
    }


    /* --------------------------------------------------------
       QR CODE
       -------------------------------------------------------- */

    if (qrImage) {

        const qrX = 50;
        const qrY = 1515;
        const qrWidth = 385;
        const qrHeight = 385;


        whiteBox(
            qrX,
            qrY,
            qrWidth,
            qrHeight
        );


        drawContain(
            qrImage,
            qrX,
            qrY,
            qrWidth,
            qrHeight
        );
    }


    /* ========================================================
       TEXT
       ======================================================== */


    /*
       ID NUMBER
    */


    drawText(
        cardNumber,
        570,
        942,
        50
    );


    /*
       BUNGALOW
    */


    drawText(
        bungalow,
        570,
        1074,
        50
    );


    /*
       NAME
    */

 
    drawText(
        name,
        570,
        1207,
        50
    );


    /*
       MANAGER NUMBER
    */


    drawText(
        manager,
        570,
        1342,
        50
    );

};
